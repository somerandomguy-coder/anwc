name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Playwright 1.51 has no Chromium build for ubuntu-latest (26.04).
        os: [ubuntu-24.04, windows-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use a long temporary path on Windows
        if: runner.os == 'Windows'
        shell: bash
        # The default TEMP is an 8.3 path (RUNNER~1), which Vite resolves inconsistently.
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build packages
        run: npm run build

      - name: Pack and audit tarballs
        run: npm run pack:packages

      - name: Run unit tests
        run: npm run test:unit

      - name: Run browser tests
        if: ${{ !cancelled() }}
        run: npm run test:browser

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anwc-artifacts-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: |
            tests/conformance/conformance-matrix.json
            artifacts/
            test-results/
            playwright-report/
          retention-days: 14
